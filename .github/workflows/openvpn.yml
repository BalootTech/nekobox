name: OpenVPN validation
on:
  push:
    branches: [codex/openvpn]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/server/go.mod
          cache-dependency-path: core/server/go.sum
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libboost-dev libyaml-cpp-dev cmake ninja-build g++ openssl
      - name: Compile and run real Qt parser tests
        run: |
          cmake -S tests/openvpn -B build-openvpn -G Ninja
          cmake --build build-openvpn
          ctest --test-dir build-openvpn --output-on-failure
      - name: Preserve existing imports
        run: |
          python3 tests/json-import/test_json_import.py --qt
          python3 tests/json-splitter/test_json_splitter.py
          python3 tests/import-dispatch/test_import_dispatch.py
          python3 tests/detour-chain/test_import_compat.py
      - name: Test bounded URL-test tunnel startup
        working-directory: core/server
        run: go test -v urltest_ready.go urltest_ready_test.go
      - name: Test native Windows VPN options and shared lifecycle
        working-directory: core/server
        run: go test -tags with_openvpn,with_gvisor ./internal/nativevpn ./internal/boxmain
      - name: Validate generated endpoints against the pinned core
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout build-openvpn/key.pem -out build-openvpn/ca.pem -days 1 -subj /CN=OpenVPN-test
          build-openvpn/openvpn_config_tests --emit-core build-openvpn/ca.pem > build-openvpn/core-configs.jsonl
          cd core/server
          go run -tags with_openvpn,with_gvisor ../../tests/openvpn/core_check.go < ../../build-openvpn/core-configs.jsonl
      - name: Build isolated Windows connection probe
        working-directory: core/server
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags with_openvpn,with_gvisor -o ../../build-openvpn/openvpn-connection-probe-windows-amd64.exe ../../tests/openvpn/connection_probe.go
      - name: Build Windows application core with URL-test fix
        working-directory: core/server
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -buildvcs=false -trimpath -ldflags '-w -s -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=1.14.1-extended-2.7.2' -tags with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls,with_dhcp,with_shadowtls,with_grpc,with_acme,with_awg,with_openvpn,with_tailscale,with_naive,with_naive_outbound,with_purego -o ../../build-openvpn/nekobox_core.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: openvpn-win64-core
          path: build-openvpn/nekobox_core.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: openvpn-connection-probe-windows-amd64
          path: build-openvpn/openvpn-connection-probe-windows-amd64.exe
          retention-days: 7
